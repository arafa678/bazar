<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4C45">
<title>Bazar</title>
<style>
  :root {
    --bg: #EEF3F1;
    --surface: #FFFFFF;
    --ink: #12302B;
    --muted: #5E746F;
    --line: #D6E0DD;
    --brand: #0F4C45;
    --brand-ink: #FFFFFF;
    --good: #1B7F4F;
    --bad: #B83A2E;
    --warn: #B7791F;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
    background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .num { font-variant-numeric: tabular-nums; }
  header { padding: 18px 20px 8px; display: flex; align-items: baseline; justify-content: space-between; }
  header h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.01em; }
  header .month { color: var(--muted); font-size: .9rem; }
  main { padding: 8px 16px calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin: 0 auto; }
  .page { display: none; }
  .page.active { display: block; }
  h2 { font-size: 1.05rem; margin: 22px 4px 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .totals .label { color: var(--muted); font-size: .85rem; }
  .totals .value { font-size: 1.7rem; font-weight: 700; }
  .banner { margin: 8px 0 0; padding: 12px 14px; border-radius: 12px; font-size: .9rem; background: #FFF4DC; color: #6B4A0B; border: 1px solid #F0D9A5; display: none; }
  .banner.show { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .banner button { flex: none; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  ul.list li:last-child { border-bottom: 0; }
  .grow { flex: 1; min-width: 0; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: .85rem; }
  .amount { font-weight: 700; }
  .pending { color: var(--warn); font-size: .8rem; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 28px 8px; }

  label.field { display: block; margin-top: 14px; font-weight: 600; font-size: .9rem; }
  input[type=text], input[type=number], select {
    width: 100%; margin-top: 6px; padding: 13px 14px; font: inherit; color: inherit;
    background: #F8FBFA; border: 1px solid var(--line); border-radius: 12px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, .capture:focus-visible, .nav button:focus-visible {
    outline: 3px solid #7FC4B7; outline-offset: 2px;
  }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 13px 18px; min-height: 48px; }
  .btn-primary { background: var(--brand); color: var(--brand-ink); font-weight: 700; width: 100%; margin-top: 18px; }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  .btn-ghost { background: transparent; color: var(--brand); font-weight: 600; border: 1px solid var(--line); }
  .btn-danger { background: var(--bad); color: #fff; font-weight: 700; }
  .btn-small { padding: 8px 12px; min-height: 36px; font-size: .85rem; }

  /* Receipt capture: the one distinctive element */
  .capture { margin-top: 14px; border: 2px dashed #8DB5AD; border-radius: var(--radius); background: #F8FBFA;
    min-height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--brand); font-weight: 700; cursor: pointer; overflow: hidden; position: relative; }
  .capture svg { width: 38px; height: 38px; }
  .capture img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
  .capture.has-photo { border-style: solid; border-color: var(--good); }
  .capture-actions { display: none; gap: 10px; margin-top: 10px; }
  .capture-actions.show { display: flex; }
  .capture-actions button { flex: 1; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .person { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; width: 100%; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; margin-bottom: 10px; }
  .add-member { display: flex; gap: 10px; }
  .add-member input { margin-top: 0; }
  .add-member button { flex: none; background: var(--brand); color: #fff; font-weight: 700; }

  .balance { font-weight: 800; font-size: 1.15rem; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .transfer { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .transfer:last-child { border-bottom: 0; }

  nav.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav button { background: none; border-radius: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; padding: 10px 4px; }
  .nav button svg { width: 24px; height: 24px; }
  .nav button.active { color: var(--brand); font-weight: 700; }

  dialog { border: 0; border-radius: 18px; padding: 20px; width: min(92vw, 420px); color: var(--ink); }
  dialog::backdrop { background: rgba(10, 30, 26, .5); }
  dialog h3 { margin: 0 0 6px; }
  dialog .actions { display: flex; gap: 10px; margin-top: 18px; }
  dialog .actions button { flex: 1; }
  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .2s; max-width: 90vw; text-align: center; z-index: 50; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<header>
  <h1>Bazar</h1>
  <span class="month" id="monthLabel"></span>
</header>

<main>
  <!-- HOME -->
  <section class="page active" id="home" aria-label="Overview">
    <div class="banner" id="syncBanner" role="status">
      <span id="syncBannerText"></span>
      <button class="btn-ghost btn-small" id="syncBtn" type="button">Sync now</button>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="totals">
        <div><div class="label">Total spent</div><div class="value num" id="totalCost">¥0</div></div>
        <div><div class="label">Each person's share</div><div class="value num" id="perPerson">¥0</div></div>
      </div>
    </div>
    <h2>Recent expenses</h2>
    <div class="card"><ul class="list" id="expenseList"></ul></div>
  </section>

  <!-- ADD -->
  <section class="page" id="add" aria-label="Add expense">
    <div class="card" style="margin-top:12px">
      <button type="button" class="capture" id="captureBtn" aria-label="Open camera to photograph receipt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
        <span id="captureText">Photograph receipt</span>
      </button>
      <div class="capture-actions" id="captureActions">
        <button type="button" class="btn-ghost" id="retakeBtn">Retake</button>
        <button type="button" class="btn-ghost" id="removePhotoBtn">Remove photo</button>
      </div>
      <!-- capture="environment" opens the rear camera directly on phones -->
      <input class="visually-hidden" type="file" id="cameraInput" accept="image/*" capture="environment" tabindex="-1">

      <label class="field" for="itemName">Item</label>
      <input type="text" id="itemName" placeholder="e.g. Rice, vegetables" autocomplete="off" maxlength="60">

      <label class="field" for="itemAmount">Amount (¥)</label>
      <input type="number" id="itemAmount" inputmode="decimal" min="1" step="any" placeholder="0">

      <label class="field" for="paidBy">Paid by</label>
      <select id="paidBy"></select>

      <button type="button" class="btn-primary" id="saveBtn">Save expense</button>
    </div>
  </section>

  <!-- PEOPLE -->
  <section class="page" id="people" aria-label="Members">
    <h2>Add a member</h2>
    <div class="card">
      <div class="add-member">
        <input type="text" id="newMemberName" placeholder="Name" aria-label="New member name" maxlength="30" autocomplete="off">
        <button type="button" id="addMemberBtn">Add</button>
      </div>
    </div>
    <h2>Members</h2>
    <div class="people" id="peopleList"></div>
  </section>

  <!-- SETTLE -->
  <section class="page" id="settle" aria-label="Settle up">
    <h2>Balances</h2>
    <div class="card"><ul class="list" id="balanceList"></ul></div>
    <h2>Who pays whom</h2>
    <div class="card" id="transferList"></div>
    <button type="button" class="btn-primary btn-danger" id="closeMonthBtn" style="margin-top:22px">Close month and start new</button>
  </section>
</main>

<nav class="nav" aria-label="Main">
  <button type="button" class="active" data-page="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home
  </button>
  <button type="button" data-page="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add
  </button>
  <button type="button" data-page="people">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5M16 5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>People
  </button>
  <button type="button" data-page="settle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>Settle
  </button>
</nav>

<dialog id="historyDlg">
  <h3 id="historyTitle"></h3>
  <div class="sub" id="historyTotal"></div>
  <ul class="list" id="historyList" style="margin-top:8px;max-height:50vh;overflow:auto"></ul>
  <div class="actions"><button type="button" class="btn-ghost" data-close>Close</button></div>
</dialog>

<dialog id="confirmDlg">
  <h3 id="confirmTitle"></h3>
  <p id="confirmText" style="margin:0;color:var(--muted)"></p>
  <div class="actions">
    <button type="button" class="btn-ghost" id="confirmNo">Cancel</button>
    <button type="button" class="btn-danger" id="confirmYes"></button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // Paste your Google Apps Script Web App URL here
  const API_URL = "https://script.google.com/macros/s/AKfycbxqHL4e2C3QPQRjlp4GJYoVc2AvQdJTMwQ10Lcjnb7SF_EWmh5opPk4evjNs9TVdRih4A/exec";
  const API_READY = /^https:\/\/script\.google\.com\//.test(API_URL);

  /* ---------- Storage ---------- */
  const store = {
    get(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
      catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch { toast("Phone storage is full. Free some space."); return false; }
    }
  };

  let members  = store.get("bazar_members", ["Arafat", "Kamran", "Nazrul", "Mamun"]);
  let expenses = store.get("bazar_expenses", []);
  // Older saved entries had no id or sync flag
  expenses = expenses.map(e => ({ id: e.id || uid(), synced: e.synced !== false, ...e, id: e.id || uid() }));

  let photo = null;      // { dataUrl, name }
  let saving = false;

  const $ = id => document.getElementById(id);
  const money = n => "¥" + Math.round(n).toLocaleString();
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function persist() { store.set("bazar_members", members); store.set("bazar_expenses", expenses); }
  function fmtDate(iso) {
    const d = new Date(iso);
    return isNaN(d) ? String(iso) : d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }
  function paidTotal(name) {
    return expenses.filter(e => e.paidBy === name).reduce((s, e) => s + Number(e.amount), 0);
  }

  /* ---------- Navigation ---------- */
  function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === id));
    document.querySelectorAll(".nav button").forEach(b => {
      const on = b.dataset.page === id;
      b.classList.toggle("active", on);
      if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => showPage(b.dataset.page)));

  /* ---------- Dialogs & toast ---------- */
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3000);
  }
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));

  function confirmDialog(title, text, okLabel) {
    return new Promise(resolve => {
      $("confirmTitle").textContent = title; $("confirmText").textContent = text; $("confirmYes").textContent = okLabel;
      const dlg = $("confirmDlg");
      const done = v => { dlg.close(); $("confirmYes").onclick = $("confirmNo").onclick = null; resolve(v); };
      $("confirmYes").onclick = () => done(true);
      $("confirmNo").onclick = () => done(false);
      dlg.showModal();
    });
  }

  /* ---------- Camera ---------- */
  function openCamera() { $("cameraInput").click(); }
  $("captureBtn").addEventListener("click", openCamera);
  $("retakeBtn").addEventListener("click", openCamera);
  $("removePhotoBtn").addEventListener("click", clearPhoto);

  $("cameraInput").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await compressImage(file, 1024, 0.62);
      photo = { dataUrl, name: "receipt_" + Date.now() + ".jpg" };
      renderCapture();
    } catch {
      toast("Could not read the photo. Try again.");
    }
    e.target.value = "";
  });

  function compressImage(file, maxSide, quality) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }

  function renderCapture() {
    const btn = $("captureBtn");
    if (photo) {
      btn.classList.add("has-photo");
      btn.innerHTML = '<img alt="Receipt preview" src="' + photo.dataUrl + '">';
      $("captureActions").classList.add("show");
    } else {
      btn.classList.remove("has-photo");
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:38px;height:38px"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg><span>Photograph receipt</span>';
      $("captureActions").classList.remove("show");
    }
  }
  function clearPhoto() { photo = null; renderCapture(); }

  /* ---------- Cloud sync ---------- */
  async function post(payload) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight on Apps Script
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || "Server error");
    return out;
  }

  function pendingList() { return expenses.filter(e => !e.synced); }

  async function syncPending() {
    if (!API_READY || !navigator.onLine) return;
    const queue = pendingList();
    if (!queue.length) return;
    for (const e of queue.slice().reverse()) {
      try {
        await post({ action: "addExpense", id: e.id, item: e.item, amount: e.amount, paidBy: e.paidBy,
                     image: e.image || null, mimeType: e.image ? "image/jpeg" : null, fileName: e.fileName || null });
        e.synced = true; delete e.image; delete e.fileName;
      } catch { break; }
    }
    persist(); renderAll();
  }
  $("syncBtn").addEventListener("click", async () => { await syncPending(); toast(pendingList().length ? "Still offline. Will retry." : "All synced."); });
  window.addEventListener("online", syncPending);

  /* ---------- Actions ---------- */
  function addMember() {
    const input = $("newMemberName");
    const name = input.value.trim();
    if (!name) return toast("Enter a name.");
    if (members.some(m => m.toLowerCase() === name.toLowerCase())) return toast(name + " is already a member.");
    members.push(name); persist(); input.value = ""; renderAll(); toast(name + " added.");
  }
  $("addMemberBtn").addEventListener("click", addMember);
  $("newMemberName").addEventListener("keydown", e => { if (e.key === "Enter") addMember(); });

  async function saveExpense() {
    if (saving) return;
    const item = $("itemName").value.trim();
    const amount = Number($("itemAmount").value);
    const paidBy = $("paidBy").value;
    if (!item) return toast("Enter what you bought.");
    if (!(amount > 0)) return toast("Enter an amount above 0.");
    if (!paidBy) return toast("Choose who paid.");

    saving = true; $("saveBtn").disabled = true; $("saveBtn").textContent = "Saving…";

    const entry = { id: uid(), item, amount, paidBy, date: new Date().toISOString(), synced: false };
    if (photo) { entry.image = photo.dataUrl; entry.fileName = photo.name; }

    let synced = false;
    if (API_READY && navigator.onLine) {
      try {
        await post({ action: "addExpense", id: entry.id, item, amount, paidBy,
                     image: entry.image || null, mimeType: entry.image ? "image/jpeg" : null, fileName: entry.fileName || null });
        synced = true;
      } catch { synced = false; }
    }
    entry.synced = synced || !API_READY;
    if (entry.synced) { delete entry.image; delete entry.fileName; }

    expenses.unshift(entry);
    persist();

    $("itemName").value = ""; $("itemAmount").value = ""; clearPhoto();
    saving = false; $("saveBtn").disabled = false; $("saveBtn").textContent = "Save expense";
    renderAll();
    toast(entry.synced ? "Expense saved." : "Saved on this phone. Will sync when online.");
    showPage("home");
  }
  $("saveBtn").addEventListener("click", saveExpense);

  async function closeMonth() {
    if (pendingList().length) {
      await syncPending();
      if (pendingList().length) return toast("Sync pending expenses before closing the month.");
    }
    const ok = await confirmDialog(
      "Close this month?",
      "Current expenses are archived to a new sheet and all balances reset to ¥0.",
      "Close month"
    );
    if (!ok) return;
    const btn = $("closeMonthBtn"); btn.disabled = true; btn.textContent = "Closing…";
    try {
      if (API_READY) await post({ action: "closeMonth" });
      expenses = []; persist(); renderAll(); showPage("home");
      toast("New month started.");
    } catch {
      toast("Could not close the month. Check your connection.");
    } finally {
      btn.disabled = false; btn.textContent = "Close month and start new";
    }
  }
  $("closeMonthBtn").addEventListener("click", closeMonth);

  function openHistory(name) {
    const list = expenses.filter(e => e.paidBy === name);
    $("historyTitle").textContent = name + "’s expenses";
    $("historyTotal").textContent = "Total paid: " + money(paidTotal(name));
    $("historyList").innerHTML = list.length
      ? list.map(e => `<li><div class="grow"><div class="title">${esc(e.item)}</div><div class="sub">${fmtDate(e.date)}</div></div><span class="amount num">${money(e.amount)}</span></li>`).join("")
      : '<li class="empty" style="display:block">No expenses yet.</li>';
    $("historyDlg").showModal();
  }

  /* ---------- Rendering ---------- */
  function renderPeople() {
    $("peopleList").innerHTML = members.map(m =>
      `<button type="button" class="person" data-name="${esc(m)}">
         <div class="avatar" aria-hidden="true">${esc(m.slice(0, 2).toUpperCase())}</div>
         <div class="title">${esc(m)}</div>
         <div class="sub num">Paid ${money(paidTotal(m))}</div>
       </button>`).join("");
    $("peopleList").querySelectorAll(".person").forEach(b => b.addEventListener("click", () => openHistory(b.dataset.name)));

    const sel = $("paidBy"), keep = sel.value;
    sel.innerHTML = members.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
    if (members.includes(keep)) sel.value = keep;
  }

  function renderExpenses() {
    const ul = $("expenseList");
    ul.innerHTML = expenses.length
      ? expenses.slice(0, 30).map(e =>
          `<li><div class="grow"><div class="title">${esc(e.item)}</div>
             <div class="sub">${fmtDate(e.date)} · paid by ${esc(e.paidBy)}${e.synced ? "" : ' · <span class="pending">Not synced</span>'}</div></div>
             <span class="amount num">${money(e.amount)}</span></li>`).join("")
      : '<li class="empty" style="display:block">No expenses yet. Tap Add to record the first one.</li>';
  }

  function renderSettle() {
    const total = expenses.reduce((s, e) => s + Number(e.amount), 0);
    const share = members.length ? total / members.length : 0;
    $("totalCost").textContent = money(total);
    $("perPerson").textContent = money(share);

    const balances = members.map(m => ({ n: m, paid: paidTotal(m), v: paidTotal(m) - share }));
    $("balanceList").innerHTML = balances.map(b =>
      `<li><div class="grow"><div class="title">${esc(b.n)}</div><div class="sub num">Paid ${money(b.paid)}</div></div>
         <span class="balance num ${b.v >= 0 ? "good" : "bad"}">${b.v >= 0 ? "+" : "−"}${money(Math.abs(b.v))}</span></li>`).join("");

    // Minimal list of payments that settles everyone
    const debtors = balances.filter(b => b.v < -0.5).map(b => ({ n: b.n, v: -b.v })).sort((a, b) => b.v - a.v);
    const creditors = balances.filter(b => b.v > 0.5).map(b => ({ n: b.n, v: b.v })).sort((a, b) => b.v - a.v);
    const out = []; let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const x = Math.min(debtors[i].v, creditors[j].v);
      out.push({ from: debtors[i].n, to: creditors[j].n, amt: x });
      debtors[i].v -= x; creditors[j].v -= x;
      if (debtors[i].v < 0.5) i++;
      if (creditors[j].v < 0.5) j++;
    }
    $("transferList").innerHTML = out.length
      ? out.map(t => `<div class="transfer"><strong>${esc(t.from)}</strong> pays <strong>${esc(t.to)}</strong> <span class="amount num">${money(t.amt)}</span></div>`).join("")
      : '<div class="empty">Everyone is settled.</div>';
  }

  function renderSync() {
    const n = pendingList().length;
    const banner = $("syncBanner");
    if (!API_READY) {
      banner.classList.add("show"); $("syncBtn").style.display = "none";
      $("syncBannerText").textContent = "Cloud sync is off. Add your Web App URL to back up to Google Sheets.";
    } else if (n) {
      banner.classList.add("show"); $("syncBtn").style.display = "";
      $("syncBannerText").textContent = n + (n === 1 ? " expense is" : " expenses are") + " waiting to sync.";
    } else {
      banner.classList.remove("show");
    }
  }

  function renderAll() { renderPeople(); renderExpenses(); renderSettle(); renderSync(); }

  /* ---------- Start ---------- */
  $("monthLabel").textContent = new Date().toLocaleDateString(undefined, { month: "long", year: "numeric" });
  persist();
  renderAll();
  syncPending();
</script>
</body>
</html>
